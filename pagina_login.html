<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
  <title>Sonora | Login</title>
</head>
<body class="pagina-autenticacao">
  <main class="auth-card">
    <aside class="auth-painel">
      <a class="voltar" href="index.html" aria-label="Voltar para a página inicial" title="Voltar">↶</a>
      <div class="painel-marca">Sonora</div>
    </aside>
    <section class="auth-conteudo">
      <div class="auth-formulario">
        <h1>Login</h1>
        <p class="subtitulo">Faça login para continuar</p>
        <form id="formLogin">
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
          </div>
          <label class="lembrar"><input type="checkbox" id="salvamento_automatico"> <span>Lembre-se de mim</span></label>
          <button class="botao botao-formulario" type="submit">Entrar</button>
          <p class="troca-pagina">Ainda não tem conta? <a href="pagina_cadastro.html">Cadastre-se</a></p>
          <p id="mensagemLogin" class="mensagem" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
