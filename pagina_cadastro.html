<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
  <title>Sonora | Cadastro</title>
</head>
<body class="pagina-autenticacao">
  <main class="auth-card">
    <aside class="auth-painel">
      <a class="voltar" href="index.html" aria-label="Voltar para a página inicial" title="Voltar">↶</a>
      <div class="painel-marca">Sonora</div>
    </aside>
    <section class="auth-conteudo">
      <div class="auth-formulario cadastro-formulario">
        <h1>Crie uma conta nova</h1>
        <p class="subtitulo">Já tem uma conta? <a href="pagina_login.html">Realize login</a></p>
        <form id="formCadastro">
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Seu nome completo" autocomplete="name" required>
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha" autocomplete="new-password" minlength="6" required>
            <small>Use pelo menos 6 caracteres.</small>
          </div>
          <div class="campo">
            <label for="dataNascimento">Data de nascimento</label>
            <input type="date" id="dataNascimento" autocomplete="bday" required>
          </div>
          <button class="botao botao-formulario" type="submit">Cadastrar</button>
          <p id="mensagemCadastro" class="mensagem" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
